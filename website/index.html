<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VanData</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="image/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-blue-900 to-gray-900">
    <div id="top"></div>
    <!-- Hero Section -->
    <section class="pt-32 pb-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        <div class="text-center mb-16">
            <h1 class="text-5xl md:text-7xl font-bold mb-6 hero-title-gradient" data-i18n="hero.title" style="padding-bottom: 5px;">
                Real-Time Pollution Intelligence for Chicago
            </h1>
            <p class="text-xl text-gray-400 max-w-3xl mx-auto mb-8" data-i18n="hero.subtitle">
                Monitor traffic emissions, predict pollution trends, and contribute to cleaner cities with AI-powered analytics
            </p>
            <div class="flex justify-center gap-4">
                <button onclick="scrollToSection('heatmap')" class="px-8 py-4 bg-blue-300 rounded-full font-semibold hover:shadow-lg hover:shadow-blue-500/30 transition-all transform hover:scale-105">
                    <i class="fas fa-map-marked-alt mr-2"></i>
                    <span data-i18n="hero.cta.map">View Heat Map</span>
                </button>
                <button onclick="handleUploadClick()" class="px-8 py-4 glass-panel rounded-full font-semibold hover:bg-white/10 transition-all transform hover:scale-105 border border-green-400/30">
                    <i class="fas fa-camera mr-2"></i>
                    <span data-i18n="hero.cta.upload">Upload Video</span>
                </button>
            </div>
        </div>

        <!-- Live Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-16">
            <div class="stat-card glass-panel rounded-2xl p-6 border border-green-500/20">
                <div class="flex items-center justify-between mb-4">
                    <i class="fas fa-car text-3xl text-green-400"></i>
                    <span class="text-xs text-gray-400 uppercase tracking-wider" data-i18n="stats.active">Active Sensors</span>
                </div>
                <div class="text-3xl font-bold text-white" id="activeSensors">1,247</div>
                <div class="text-sm text-green-400 mt-2"><i class="fas fa-arrow-up mr-1"></i>+12% <span data-i18n="stats.today">today</span></div>
            </div>
            
            <div class="stat-card glass-panel rounded-2xl p-6 border border-blue-500/20">
                <div class="flex items-center justify-between mb-4">
                    <i class="fas fa-cloud text-3xl text-blue-400"></i>
                    <span class="text-xs text-gray-400 uppercase tracking-wider" data-i18n="stats.co2">CO2 Emissions</span>
                </div>
                <div class="text-3xl font-bold text-white" id="co2Level">2.4k</div>
                <div class="text-sm text-gray-400 mt-2">tons <span data-i18n="stats.hourly">/ hour</span></div>
            </div>
            
            <div class="stat-card glass-panel rounded-2xl p-6 border border-yellow-500/20">
                <div class="flex items-center justify-between mb-4">
                    <i class="fas fa-truck text-3xl text-yellow-400"></i>
                    <span class="text-xs text-gray-400 uppercase tracking-wider" data-i18n="stats.trucks">Heavy Vehicles</span>
                </div>
                <div class="text-3xl font-bold text-white" id="truckCount">892</div>
                <div class="text-sm text-yellow-400 mt-2"><i class="fas fa-exclamation-triangle mr-1"></i><span data-i18n="stats.high">High traffic</span></div>
            </div>
            
            <div class="stat-card glass-panel rounded-2xl p-6 border border-purple-500/20">
                <div class="flex items-center justify-between mb-4">
                    <i class="fas fa-brain text-3xl text-purple-400"></i>
                    <span class="text-xs text-gray-400 uppercase tracking-wider" data-i18n="stats.accuracy">AI Accuracy</span>
                </div>
                <div class="text-3xl font-bold text-white">94.2%</div>
                <div class="text-sm text-purple-400 mt-2"><i class="fas fa-check-circle mr-1"></i><span data-i18n="stats.validated">Validated</span></div>
            </div>
        </div>
    </section>

    <div id="mapSection"></div>
    <div id="chartSection"></div>
    <div id="chatSection"></div>

    <script src="js/auth.js"></script>
    <script src="js/translation.js"></script>
    <script src="js/components.js"></script>
    <script src="js/heatmap-config.js"></script>
    <script>
      window.TRAFFIC_MAP_API_URL = "https://kingkoolkat--ecotrack-inference-traffic-map.modal.run";
    </script>
    <script src="js/main.js"></script>
</body>
</html>
